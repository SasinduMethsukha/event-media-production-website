    }

    /* Neon Glow Effects */
    .text-glow-red {
      text-shadow: 0 0 25px rgba(229, 9, 20, 0.85), 0 0 40px rgba(255, 30, 39, 0.5);
    }

    /* Ticker Marquee Animation */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 22s linear infinite;
    }

    /* REC Pulsing Dot */
    @keyframes recBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 10px #ff1e27); }
      50% { opacity: 0.2; }
    }

    .animate-rec {
      animation: recBlink 1.2s infinite;
    }

    /* Motion Graphics Equalizer Soundwave */
    @keyframes soundEq {
      0%, 100% { height: 25%; }
      50% { height: 100%; }
    }
    .animate-eq-bar1 { animation: soundEq 0.8s ease-in-out infinite; }
    .animate-eq-bar2 { animation: soundEq 1.1s ease-in-out infinite 0.2s; }
    .animate-eq-bar3 { animation: soundEq 0.6s ease-in-out infinite 0.4s; }
    .animate-eq-bar4 { animation: soundEq 0.9s ease-in-out infinite 0.1s; }
    .animate-eq-bar5 { animation: soundEq 0.7s ease-in-out infinite 0.3s; }

    /* Subtle Motion Glow Floating Particles */
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.9; }
    }
    .animate-float-glow {
      animation: floatParticle 4s ease-in-out infinite;
    }

    /* Mesh Core HUD Animations */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseSlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.95); }
    }
    .animate-spin-slow { animation: spinSlow 35s linear infinite; transform-origin: center; }
    .animate-spin-reverse { animation: spinReverse 25s linear infinite; transform-origin: center; }
    .animate-pulse-slow { animation: pulseSlow 4s ease-in-out infinite; transform-origin: center; }

    @media (prefers-reduced-motion: reduce) {

                    className="w-full p-3 rounded bg-brand-black border border-slate-800 hover:border-slate-600 text-slate-300 text-center font-bold"
                  >
                    {copiedNotice ? "✓ QUOTE SUMMARY COPIED TO CLIPBOARD!" : "📋 Copy Quote Summary Text"}
                  </button>

                </div>

              </div>
            </div>
          )}

          {/* FLOATING WHATSAPP BUTTON */}
          <a href={`https://wa.me/${companyInfo.whatsappPhone}?text=${encodeURIComponent("Hi Event Media Production, I'm interested in getting a quotation for an upcoming event.")}`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-40 bg-emerald-600 text-white p-3.5 rounded-full shadow-[0_0_25px_rgba(16,185,129,0.5)] flex items-center gap-2">
            <i data-lucide="message-square" className="w-6 h-6"></i>
          </a>

          {/* FOOTER WITH SOCIAL ICONS */}
          <footer className="bg-brand-black border-t border-slate-800 py-12 text-center text-xs font-orbitron text-slate-500">
            
            {/* Footer Logo */}
            <div className="flex justify-center mb-4">
              <img src="./logo.png" alt="Event Media Production" className="h-12 w-auto object-contain filter drop-shadow-[0_0_10px_rgba(229,9,20,0.5)]" />
            </div>

            <p className="mb-4 text-white font-black text-sm">EVENT MEDIA PRODUCTION (PVT) LTD</p>
            
            {/* Social Icons Bar */}
            <div className="flex justify-center items-center gap-4 mb-6">
              <SocialIcons size="w-5 h-5" />
            </div>

            <p className="font-tech text-slate-500">© {new Date().getFullYear()} Event Media Production (Pvt) Ltd. All Rights Reserved. Sri Lanka.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

                    </div>
                    <span className="text-brand-red font-bold group-hover:translate-x-1 transition-transform">➔</span>
                  </button>

                  {/* Option 2: Default Mail App / Outlook */}
                  <button 
                    onClick={dispatchViaMailto}
                    className="w-full p-4 rounded bg-slate-900 border border-slate-800 hover:border-blue-500 hover:bg-slate-800 text-left flex items-center justify-between group transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <span className="w-8 h-8 rounded bg-blue-600/20 text-blue-400 font-bold flex items-center justify-center">📧</span>
                      <div>
                        <span className="font-bold text-white block">Default Mail App / Outlook</span>
                        <span className="text-[11px] text-slate-400">Launches Outlook / Apple Mail / Mail Client</span>
                      </div>
                    </div>
                    <span className="text-blue-400 font-bold group-hover:translate-x-1 transition-transform">➔</span>
                  </button>

                  {/* Option 3: WhatsApp Inquiry */}
                  <button 
                    onClick={dispatchViaWhatsApp}
                    className="w-full p-4 rounded bg-slate-900 border border-slate-800 hover:border-emerald-500 hover:bg-slate-800 text-left flex items-center justify-between group transition-all"
                  >
                    <div className="flex items-center gap-3">
                      <span className="w-8 h-8 rounded bg-emerald-600/20 text-emerald-400 font-bold flex items-center justify-center">💬</span>
                      <div>
                        <span className="font-bold text-white block">WhatsApp Instant Message</span>
                        <span className="text-[11px] text-slate-400">Sends formatted quote summary to WhatsApp</span>
                      </div>
                    </div>
                    <span className="text-emerald-400 font-bold group-hover:translate-x-1 transition-transform">➔</span>
                  </button>

                  {/* Option 4: Copy Text */}
                  <button 
                    onClick={copyToClipboard}
                    className="w-full p-3 rounded bg-brand-black border border-slate-800 hover:border-slate-600 text-slate-300 text-center font-bold"
                  >
                    {copiedNotice ? "✓ QUOTE SUMMARY COPIED TO CLIPBOARD!" : "📋 Copy Quote Summary Text"}
                  </button>

                </div>

              </div>
            </div>
          )}

          {/* FLOATING WHATSAPP BUTTON */}
          <a href={`https://wa.me/${companyInfo.whatsappPhone}?text=${encodeURIComponent("Hi Event Media Production, I'm interested in getting a quotation for an upcoming event.")}`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-40 bg-emerald-600 text-white p-3.5 rounded-full shadow-[0_0_25px_rgba(16,185,129,0.5)] flex items-center gap-2">
            <i data-lucide="message-square" className="w-6 h-6"></i>
          </a>

          {/* FOOTER WITH SOCIAL ICONS */}
          <footer className="bg-brand-black border-t border-slate-800 py-12 text-center text-xs font-orbitron text-slate-500">
            
            {/* Footer Logo */}
            <div className="flex justify-center mb-4">
              <img src="./logo.png" alt="Event Media Production" className="h-12 w-auto object-contain filter drop-shadow-[0_0_10px_rgba(229,9,20,0.5)]" />
            </div>

            <p className="mb-4 text-white font-black text-sm">EVENT MEDIA PRODUCTION (PVT) LTD</p>
            
            {/* Social Icons Bar */}
            <div className="flex justify-center items-center gap-4 mb-6">
              <SocialIcons size="w-5 h-5" />
            </div>

            <p className="font-tech text-slate-500">© {new Date().getFullYear()} Event Media Production (Pvt) Ltd. All Rights Reserved. Sri Lanka.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
